version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./db:/app/db
    environment:
      - FLASK_APP=api/app.py
      - FLASK_ENV=development
    command: flask run --host=0.0.0.0 --port=5000

  # Optional: One-off training service
  # train:
