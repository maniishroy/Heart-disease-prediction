<!-- AI Chatbot Widget -->
<div id="chatbot-widget">
    <button id="chatbot-toggle" class="chatbot-toggle" aria-label="Open chatbot">
        <svg class="chatbot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
        <svg class="chatbot-close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
        <span class="chatbot-badge">?</span>
    </button>
    
    <div id="chatbot-panel" class="chatbot-panel">
        <div class="chatbot-header">
            <div class="chatbot-header-info">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
                <div>
                    <h4>HeartCheck Assistant</h4>
                    <span class="chatbot-status">
                        <span class="status-dot"></span>
                        Online
                    </span>
                </div>
            </div>
            <button id="chatbot-close-btn" class="chatbot-close-btn" aria-label="Close chatbot">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        
        <div class="chatbot-messages" id="chatbot-messages">
            <div class="chatbot-message bot-message">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <p>Hi! I'm your HeartCheck Assistant. How can I help you today?</p>
                    <div class="quick-actions">
                        <button class="quick-action-btn" data-action="start">Start Assessment</button>
                        <button class="quick-action-btn" data-action="how">How it Works</button>
                        <button class="quick-action-btn" data-action="results">View Results</button>
                        <button class="quick-action-btn" data-action="datasets">About Data</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="chatbot-input-wrapper">
            <input type="text" id="chatbot-input" class="chatbot-input" placeholder="Ask me anything..." autocomplete="off">
            <button id="chatbot-send" class="chatbot-send-btn" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>
</div>

<style>
/* Chatbot Styles */
#chatbot-widget {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
}

.chatbot-toggle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
}

.chatbot-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 48px rgba(239, 68, 68, 0.4);
}

.chatbot-toggle:active {
    transform: scale(0.95);
}

.chatbot-toggle svg {
    width: 28px;
    height: 28px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.3s;
}

.chatbot-toggle.active .chatbot-icon {
    display: none;
}

.chatbot-toggle.active .chatbot-close-icon {
    display: block !important;
}

.chatbot-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 24px;
    height: 24px;
    background: #10b981;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
    animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.chatbot-panel {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 380px;
    height: 550px;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.3s ease;
}

.chatbot-panel.active {
    display: flex;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.chatbot-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem;
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(249, 115, 22, 0.1));
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.chatbot-header-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.chatbot-header-info svg {
    width: 32px;
    height: 32px;
    padding: 6px;
    background: rgba(239, 68, 68, 0.2);
    border-radius: 8px;
    stroke: var(--accent);
}

.chatbot-header-info h4 {
    margin: 0 0 4px 0;
    font-size: 1rem;
    color: #fff;
}

.chatbot-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--muted);
}

.status-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.2); }
}

.chatbot-close-btn {
    width: 32px;
    height: 32px;
    background: rgba(255, 255, 255, 0.05);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.chatbot-close-btn svg {
    width: 18px;
    height: 18px;
    stroke: var(--muted);
}

.chatbot-close-btn:hover {
    background: rgba(255, 255, 255, 0.1);
}

.chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.chatbot-messages::-webkit-scrollbar {
    width: 6px;
}

.chatbot-messages::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.02);
}

.chatbot-messages::-webkit-scrollbar-thumb {
    background: rgba(239, 68, 68, 0.3);
    border-radius: 3px;
}

.chatbot-message {
    display: flex;
    gap: 10px;
    animation: fadeInUp 0.3s ease;
}

.user-message {
    flex-direction: row-reverse;
}

.message-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}

.user-message .message-avatar {
    background: rgba(255, 255, 255, 0.1);
}

.message-content {
    max-width: 70%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.user-message .message-content {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(249, 115, 22, 0.2));
    border-color: rgba(239, 68, 68, 0.3);
}

.message-content p {
    margin: 0;
    font-size: 0.9rem;
    line-height: 1.5;
    color: #e6eef8;
}

.quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

.quick-action-btn {
    padding: 6px 14px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 20px;
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

.quick-action-btn:hover {
    background: rgba(239, 68, 68, 0.2);
    border-color: var(--accent);
    transform: translateY(-2px);
}

.chatbot-input-wrapper {
    display: flex;
    gap: 8px;
    padding: 1rem;
    background: rgba(255, 255, 255, 0.02);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.chatbot-input {
    flex: 1;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    transition: all 0.2s;
}

.chatbot-input:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.08);
}

.chatbot-send-btn {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-send-btn svg {
    width: 20px;
    height: 20px;
    stroke: white;
}

.chatbot-send-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
}

.chatbot-send-btn:active {
    transform: scale(0.95);
}

.typing-indicator {
    display: flex;
    gap: 4px;
    padding: 8px 0;
}

.typing-dot {
    width: 8px;
    height: 8px;
    background: var(--muted);
    border-radius: 50%;
    animation: typing 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) {
    animation-delay: 0.2s;
}

.typing-dot:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
    30% { transform: translateY(-10px); opacity: 1; }
}

/* Mobile responsive */
@media (max-width: 480px) {
    #chatbot-widget {
        bottom: 16px;
        right: 16px;
    }
    
    .chatbot-panel {
        width: calc(100vw - 32px);
        height: calc(100vh - 160px);
        bottom: 80px;
        right: -8px;
    }
    
    .chatbot-toggle {
        width: 56px;
        height: 56px;
    }
}
</style>

<script>
// Chatbot functionality
(function() {
    const chatbotToggle = document.getElementById('chatbot-toggle');
    const chatbotPanel = document.getElementById('chatbot-panel');
    const chatbotCloseBtn = document.getElementById('chatbot-close-btn');
    const chatbotInput = document.getElementById('chatbot-input');
    const chatbotSend = document.getElementById('chatbot-send');
    const chatbotMessages = document.getElementById('chatbot-messages');
    
    // Knowledge base for the chatbot
    const responses = {
        'start': {
            text: "Great! Let's begin your heart health assessment. Click the button below to start:",
            action: {
                text: "Start Assessment Now",
                url: "{{ url_for('predict') }}"
            }
        },
        'how': {
            text: "Here's how HeartCheck works:\n\n1. Enter your health data (13 cardiac indicators)\n2. Our AI model analyzes your information\n3. Get instant risk assessment with personalized recommendations\n\nThe process takes less than 3 minutes!",
            action: {
                text: "Learn More",
                url: "#how-it-works"
            }
        },
        'results': {
            text: "To view your previous assessment results, you need to be logged in. If you just completed an assessment, your results should be displayed automatically.",
            action: {
                text: "View My Results",
                url: "{{ url_for('admin') }}"
            }
        },
        'datasets': {
            text: "Our model is trained on 100,000+ real patient records from trusted sources including UCI Heart Disease Dataset, Kaggle datasets, and Framingham Heart Study. We achieve 99.2% accuracy!",
            action: {
                text: "Explore Datasets",
                url: "{{ url_for('dataset') }}"
            }
        },
        'accuracy': {
            text: "Our deep learning model achieves 99.2% accuracy with:\n• 98% AUC-ROC Score\n• 97.8% Precision\n• 98.5% Recall\n\nValidated on 20,000+ independent test cases!"
        },
        'privacy': {
            text: "We take your privacy seriously:\n• All data is anonymized\n• No personal health information is stored\n• Results are for informational purposes only\n• Always consult a healthcare professional"
        },
        'time': {
            text: "The entire assessment takes less than 3 minutes:\n• 2 minutes to fill the form\n• <30 seconds for AI analysis\n• Instant results with detailed insights"
        },
        'default': {
            text: "I can help you with:\n• Starting an assessment\n• How our system works\n• Viewing your results\n• Information about our datasets\n• Model accuracy details\n• Privacy & security\n\nWhat would you like to know?"
        }
    };
    
    // Toggle chatbot
    function toggleChatbot() {
        chatbotPanel.classList.toggle('active');
        chatbotToggle.classList.toggle('active');
        if (chatbotPanel.classList.contains('active')) {
            chatbotInput.focus();
        }
    }
    
    chatbotToggle.addEventListener('click', toggleChatbot);
    chatbotCloseBtn.addEventListener('click', toggleChatbot);
    
    // Add message to chat
    function addMessage(text, isUser = false, action = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chatbot-message ${isUser ? 'user-message' : 'bot-message'}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = isUser ? '👤' : '🤖';
        
        const content = document.createElement('div');
        content.className = 'message-content';
        
        const p = document.createElement('p');
        p.textContent = text;
        p.style.whiteSpace = 'pre-line';
        content.appendChild(p);
        
        if (action) {
            const actionBtn = document.createElement('button');
            actionBtn.className = 'quick-action-btn';
            actionBtn.textContent = action.text;
            actionBtn.style.marginTop = '12px';
            actionBtn.onclick = () => {
                if (action.url.startsWith('#')) {
                    toggleChatbot();
                    setTimeout(() => {
                        document.querySelector(action.url)?.scrollIntoView({ behavior: 'smooth' });
                    }, 300);
                } else {
                    window.location.href = action.url;
                }
            };
            content.appendChild(actionBtn);
        }
        
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);
        chatbotMessages.appendChild(messageDiv);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
    }
    
    // Show typing indicator
    function showTyping() {
        const typing = document.createElement('div');
        typing.className = 'chatbot-message bot-message typing-indicator-wrapper';
        typing.innerHTML = `
            <div class="message-avatar">🤖</div>
            <div class="message-content">
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        `;
        chatbotMessages.appendChild(typing);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
        return typing;
    }
    
    // Process user message
    function processMessage(message) {
        const lowerMessage = message.toLowerCase();
        let response = responses.default;
        
        // Simple keyword matching
        if (lowerMessage.includes('start') || lowerMessage.includes('assess') || lowerMessage.includes('begin')) {
            response = responses.start;
        } else if (lowerMessage.includes('how') || lowerMessage.includes('work')) {
            response = responses.how;
        } else if (lowerMessage.includes('result') || lowerMessage.includes('history')) {
            response = responses.results;
        } else if (lowerMessage.includes('data') || lowerMessage.includes('dataset') || lowerMessage.includes('source')) {
            response = responses.datasets;
        } else if (lowerMessage.includes('accura') || lowerMessage.includes('perform')) {
            response = responses.accuracy;
        } else if (lowerMessage.includes('privacy') || lowerMessage.includes('security') || lowerMessage.includes('safe')) {
            response = responses.privacy;
        } else if (lowerMessage.includes('time') || lowerMessage.includes('long') || lowerMessage.includes('quick')) {
            response = responses.time;
        }
        
        return response;
    }
    
    // Send message
    function sendMessage() {
        const message = chatbotInput.value.trim();
        if (!message) return;
        
        addMessage(message, true);
        chatbotInput.value = '';
        
        const typing = showTyping();
        
        setTimeout(() => {
            typing.remove();
            const response = processMessage(message);
            addMessage(response.text, false, response.action);
        }, 1000);
    }
    
    chatbotSend.addEventListener('click', sendMessage);
    chatbotInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
    
    // Quick action buttons
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('quick-action-btn')) {
            const action = e.target.getAttribute('data-action');
            if (action && responses[action]) {
                addMessage(e.target.textContent, true);
                const typing = showTyping();
                setTimeout(() => {
                    typing.remove();
                    const response = responses[action];
                    addMessage(response.text, false, response.action);
                }, 800);
            }
        }
    });
})();
</script>
